<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a3a8e">
<title>VIS Group — App Vigilantes</title>
<style>
:root {
  --vis-blue: #1a3a8e;
  --vis-blue-dark: #142d6d;
  --vis-blue-light: #2c4ea8;
  --bg: #fafafa;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-2: #d1d5db;
  --text: #1f2937;
  --text-2: #6b7280;
  --text-3: #9ca3af;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; width: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}
button, input { font-family: inherit; font-size: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }

/* ===== App container ===== */
.app {
  position: relative;
  width: 100%;
  height: 100dvh;
  height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ===== Screens ===== */
.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  background: var(--surface);
}
.screen.active { display: flex; }

/* ===== Header ===== */
.header {
  height: 56px;
  flex-shrink: 0;
  background: var(--surface);
  display: flex;
  align-items: center;
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
  padding-top: env(safe-area-inset-top);
  height: calc(56px + env(safe-area-inset-top));
}
.header.with-back .header-icon-btn {
  color: var(--text);
}
.header-icon-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
}
.header-icon-btn svg { width: 24px; height: 24px; stroke-width: 2; }
.header-title {
  flex: 1;
  font-size: 18px;
  font-weight: 500;
  color: var(--text);
  text-align: center;
  padding-right: 44px; /* compensa back button per centrare */
}
.header.has-action .header-title { padding-right: 0; }

/* ===== Bottom bar (blu) ===== */
.bottom-bar {
  flex-shrink: 0;
  background: var(--vis-blue);
  height: 64px;
  position: relative;
  padding-bottom: env(safe-area-inset-bottom);
  height: calc(64px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  padding-left: 12px;
  padding-right: 12px;
}
.bottom-bar.with-fab {
  justify-content: space-between;
}
.bottom-bar .menu-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: white;
}
.bottom-bar .menu-btn svg { width: 22px; height: 22px; }
.bottom-bar .logout-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: white;
  font-size: 15px;
  letter-spacing: 0.04em;
  font-weight: 500;
  text-transform: uppercase;
  height: 44px;
}
.bottom-bar .logout-btn svg { width: 20px; height: 20px; }

/* FAB centrale (sopra la bottom-bar) */
.fab {
  position: absolute;
  left: 50%;
  top: -28px;
  transform: translateX(-50%);
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--vis-blue);
  border: 4px solid var(--surface);
  color: white;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.18);
  z-index: 2;
}
.fab svg { width: 22px; height: 22px; stroke-width: 2; }
.fab:active { background: var(--vis-blue-light); }

/* ===== Logo VIS (SVG icon) ===== */
.logo-vis {
  display: inline-block;
}

/* ===== LOGIN screen ===== */
#login {
  background: var(--surface);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-content {
  width: 100%;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.login-content .logo-vis {
  margin-bottom: 32px;
}
.login-spacer { height: 8px; }
.login-form {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.login-form .field input {
  width: 100%;
  padding: 14px 14px;
  border: 1px solid var(--border-2);
  border-radius: 6px;
  background: var(--surface);
  font-size: 16px;
}
.login-form .field input:focus { outline: 2px solid var(--vis-blue); outline-offset: -1px; border-color: var(--vis-blue); }
.login-form .login-btn {
  background: var(--vis-blue);
  color: white;
  padding: 14px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 6px;
}
.login-form .login-btn:active { background: var(--vis-blue-dark); }
.login-form .login-btn:disabled { opacity: 0.5; }
.login-error {
  background: #fef2f2;
  color: var(--danger);
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  display: none;
}
.login-error.show { display: block; }
.login-hint {
  margin-top: 24px;
  text-align: center;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}
.login-hint code {
  font-family: ui-monospace, monospace;
  background: var(--bg);
  padding: 2px 6px;
  border-radius: 3px;
  color: var(--vis-blue);
}

/* ===== HOME screen ===== */
#home .content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 32px 24px;
  text-align: center;
}
#home .greeting {
  font-size: 28px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}
#home .subtitle {
  font-size: 16px;
  color: var(--text-2);
  margin-bottom: 8px;
}
#home .vigilante-name {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 32px;
}
#home .big-logo {
  margin: auto 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Drawer ===== */
.drawer-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 50;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 80%;
  max-width: 320px;
  background: var(--surface);
  z-index: 51;
  transform: translateX(-100%);
  transition: transform 0.22s ease-out;
  display: flex;
  flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  padding: 24px 20px 24px;
  padding-top: calc(24px + env(safe-area-inset-top));
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}
.drawer-menu { flex: 1; padding: 8px 0; }
.drawer-menu .item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 24px;
  font-size: 16px;
  color: var(--text);
  width: 100%;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.drawer-menu .item svg {
  width: 22px; height: 22px;
  color: var(--text-2);
  stroke-width: 1.8;
}
.drawer-menu .item.active {
  color: var(--vis-blue);
  background: rgba(26, 58, 142, 0.04);
}
.drawer-menu .item.active svg { color: var(--vis-blue); }
.drawer-footer {
  padding: 12px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: var(--vis-blue);
}
.drawer-footer .logout-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: white;
  font-size: 15px;
  letter-spacing: 0.06em;
  font-weight: 500;
  text-transform: uppercase;
  padding: 14px;
}
.drawer-footer .logout-btn svg { width: 18px; height: 18px; }

/* ===== Check-in list ===== */
#checkins .content {
  flex: 1;
  overflow-y: auto;
  padding-bottom: 80px;
}
.checkin-item {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 16px 16px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.checkin-check {
  flex-shrink: 0;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--vis-blue);
  display: flex; align-items: center; justify-content: center;
  color: white;
  margin-top: 2px;
}
.checkin-check svg { width: 22px; height: 22px; stroke-width: 2.5; }
.checkin-info {
  flex: 1;
  min-width: 0;
}
.checkin-info .cliente {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.checkin-info .struttura,
.checkin-info .time {
  font-size: 13px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.checkin-info svg {
  width: 14px; height: 14px;
  flex-shrink: 0;
  color: var(--text-2);
  stroke-width: 1.8;
}
.checkin-empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--text-3);
  font-size: 14px;
  line-height: 1.5;
}
.pending-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  background: var(--warning);
  color: white;
  padding: 2px 6px;
  border-radius: 3px;
  margin-left: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  vertical-align: middle;
}

/* ===== SCAN screen ===== */
#scan {
  background: var(--surface);
  align-items: center;
  justify-content: flex-start;
}
#scan .header { border-bottom: none; }
#scan .scan-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 24px 100px;
  width: 100%;
}
.scan-pulse-wrap {
  position: relative;
  width: 200px; height: 200px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 32px;
}
.scan-pulse-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--vis-blue);
  animation: ring-pulse 1.8s ease-out infinite;
  opacity: 0;
}
.scan-pulse-ring.r2 { animation-delay: 0.6s; }
.scan-pulse-ring.r3 { animation-delay: 1.2s; }
@keyframes ring-pulse {
  0% { transform: scale(0.55); opacity: 0; }
  20% { opacity: 0.9; }
  100% { transform: scale(1); opacity: 0; }
}
.scan-pulse-core {
  width: 110px; height: 110px;
  border-radius: 50%;
  background: var(--vis-blue);
  display: flex; align-items: center; justify-content: center;
  color: white;
  z-index: 2;
}
.scan-pulse-core svg { width: 50px; height: 50px; stroke-width: 1.8; }

.scan-status-title {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  margin-bottom: 8px;
}
.scan-status-msg {
  font-size: 15px;
  color: var(--text-2);
  text-align: center;
  margin-bottom: 24px;
  max-width: 300px;
  line-height: 1.5;
}
.scan-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 280px;
}
.scan-buttons button {
  padding: 14px 20px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 500;
}
.scan-btn-primary { background: var(--vis-blue); color: white; }
.scan-btn-primary:active { background: var(--vis-blue-dark); }
.scan-btn-secondary {
  background: white; color: var(--vis-blue);
  border: 1px solid var(--vis-blue);
}
.scan-btn-cancel {
  background: transparent;
  color: var(--text-2);
  font-size: 13px;
}

/* Stato scan: success */
#scan.success .scan-pulse-ring { display: none; }
#scan.success .scan-pulse-core { background: var(--success); transform: scale(1.1); transition: all 0.3s; }
#scan.error .scan-pulse-ring { display: none; }
#scan.error .scan-pulse-core { background: var(--danger); }

/* ===== Result modal ===== */
.modal {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}
.modal.open { display: flex; }
.modal-card {
  background: var(--surface);
  width: 100%;
  border-radius: 16px 16px 0 0;
  padding: 24px 20px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
  animation: slide-up 0.22s ease-out;
}
@keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-card .icon-wrap {
  width: 64px; height: 64px;
  border-radius: 50%;
  margin: 0 auto 16px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(16, 185, 129, 0.12);
  color: var(--success);
}
.modal-card .icon-wrap svg { width: 36px; height: 36px; stroke-width: 2.5; }
.modal-card.error .icon-wrap { background: rgba(239, 68, 68, 0.12); color: var(--danger); }
.modal-card .title {
  font-size: 18px; font-weight: 600;
  text-align: center; margin-bottom: 6px;
}
.modal-card .msg {
  font-size: 14px; color: var(--text-2);
  text-align: center; margin-bottom: 16px;
  line-height: 1.5;
}
.modal-card .details {
  background: var(--bg);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.modal-card .details .row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  font-size: 13px;
}
.modal-card .details .row strong {
  min-width: 80px;
  color: var(--text-2);
  font-weight: 500;
}
.modal-card .details .row span {
  color: var(--text);
  flex: 1;
  word-break: break-word;
}
.modal-card .actions {
  display: flex;
  gap: 10px;
}
.modal-card .actions button {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 500;
}
.modal-card .actions .primary {
  background: var(--vis-blue);
  color: white;
}
.modal-card .actions .secondary {
  background: var(--bg);
  color: var(--text);
}

/* Simulator picker */
.sim-list {
  max-height: 50vh;
  overflow-y: auto;
  margin: 0 -20px 16px;
}
.sim-list .sim-item {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.sim-list .sim-item:active { background: var(--bg); }
.sim-list .sim-item strong { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px; }
.sim-list .sim-item span { color: var(--text-2); font-size: 12px; }

/* ===== Toast ===== */
.toast {
  position: absolute;
  left: 50%;
  bottom: 100px;
  transform: translate(-50%, 20px);
  background: var(--text);
  color: white;
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 13px;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.22s;
  white-space: nowrap;
  max-width: 90%;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* Online/offline indicator */
.connection-pill {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 8px);
  right: 8px;
  display: flex; align-items: center; gap: 5px;
  font-size: 11px;
  color: var(--text-3);
  background: var(--bg);
  padding: 3px 8px;
  border-radius: 10px;
  z-index: 5;
}
.connection-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--success);
}
.connection-pill.offline .dot { background: var(--text-3); }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============ LOGIN ============ -->
  <div class="screen active" id="login">
    <div class="login-content">
      <div class="logo-vis"></div>
      <div class="login-spacer"></div>
      <form class="login-form" onsubmit="event.preventDefault(); doLogin();">
        <div class="field"><input type="text" id="login-username" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off"></div>
        <div class="field"><input type="password" id="login-password" placeholder="Password" autocomplete="current-password"></div>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="login-btn" id="login-btn">Accedi</button>
      </form>
      <div class="login-hint">
        Demo: prova con <code>delta5</code> / <code>d5Pass24</code><br>
        oppure <code>kappa.basic</code> / <code>kb2024Az</code>
      </div>
    </div>
  </div>

  <!-- ============ HOME ============ -->
  <div class="screen" id="home">
    <div class="header">
      <button class="header-icon-btn" onclick="toggleDrawer(true)" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
      </button>
      <div class="header-title"></div>
    </div>
    <div class="content">
      <div class="greeting">Benvenuto</div>
      <div class="subtitle">Effettua un check-in</div>
      <div class="vigilante-name" id="home-vigilante-name"></div>
      <div class="big-logo" id="home-big-logo"></div>
    </div>
    <div class="bottom-bar with-fab">
      <button class="menu-btn" onclick="toggleDrawer(true)" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" stroke-width="2"/></svg>
      </button>
      <button class="fab" onclick="goToScan()" aria-label="Effettua check-in">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/>
        </svg>
      </button>
      <div style="width:44px"></div>
    </div>
  </div>

  <!-- ============ SCAN ============ -->
  <div class="screen" id="scan">
    <div class="header with-back">
      <button class="header-icon-btn" onclick="goBack('home')" aria-label="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-title">Check-in</div>
    </div>
    <div class="scan-content">
      <div class="scan-pulse-wrap">
        <div class="scan-pulse-ring"></div>
        <div class="scan-pulse-ring r2"></div>
        <div class="scan-pulse-ring r3"></div>
        <div class="scan-pulse-core">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
        </div>
      </div>
      <div class="scan-status-title" id="scan-title">Avvicina al tag</div>
      <div class="scan-status-msg" id="scan-msg">Tieni il telefono vicino al tag NFC della struttura per registrare il check-in.</div>
      <div class="scan-buttons">
        <button class="scan-btn-secondary" onclick="openSimulator()">Simula scansione</button>
        <button class="scan-btn-cancel" onclick="goBack('home')">Annulla</button>
      </div>
    </div>
  </div>

  <!-- ============ CHECK-INS LIST ============ -->
  <div class="screen" id="checkins">
    <div class="header with-back">
      <button class="header-icon-btn" onclick="goBack('home')" aria-label="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-title">Check-in effettuati</div>
      <button class="header-icon-btn" onclick="showToast('Filtri in arrivo')" aria-label="Filtri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      </button>
    </div>
    <div class="content" id="checkins-list"></div>
    <div class="bottom-bar with-fab">
      <button class="menu-btn" onclick="toggleDrawer(true)" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round" stroke-width="2"/></svg>

// HELPERS
// ============================================================
const uid = () => {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) {
    try { return crypto.randomUUID(); } catch (_) {}
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
};
const nowISO = () => new Date().toISOString();
const escape = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDateTime = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const clienteDisplay = c => {
  if (!c) return '';
  const persona = `${c.cognome || ''} ${c.nome || ''}`.trim();
  if (c.ragione_sociale && persona && c.ragione_sociale !== persona) return `${c.ragione_sociale}, ${persona}`;
  return c.ragione_sociale || persona || 'Senza nome';
};

// ============================================================
// STORAGE (window.storage con fallback in-memory)
// ============================================================
const Storage = (() => {
  const mem = {};
  const has = typeof window !== 'undefined' && window.storage
    && typeof window.storage.get === 'function';
  return {
    async get(key) {
      if (has) { try { return await window.storage.get(key); } catch (_) {} }
      return mem[key] != null ? {key, value: mem[key]} : null;
    },
    async set(key, value) {
      if (has) { try { return await window.storage.set(key, value); } catch (_) {} }
      mem[key] = value;
    },
  };
})();

};

const KEYS = {
  clienti: 'visapp:v2:clienti',
  strutture: 'visapp:v2:strutture',
  tipiStrutture: 'visapp:v2:tipiStrutture',
  tagNfc: 'visapp:v2:tagNfc',
  vigilantes: 'visapp:v2:vigilantes',
  utenti: 'visapp:v2:utenti',
  checkins: 'visapp:v2:checkins',
  session: 'visapp:v2:session',
};

async function loadAll() {
  for (const [k, key] of Object.entries(KEYS)) {
    if (k === 'session') continue;
    try {
      const r = await Storage.get(key);
      if (r && r.value) state.data[k] = JSON.parse(r.value);
    } catch (_) {}
  }
}
async function saveSection(k) {
  await Storage.set(KEYS[k], JSON.stringify(state.data[k]));
}

// ============================================================
// LOGIN / LOGOUT
// ============================================================
async function tryRestoreSession() {
  try {
    const r = await Storage.get(KEYS.session);
    if (r && r.value) {
      const s = JSON.parse(r.value);
      const u = state.data.utenti.find(u => u.id === s.utente_id);
      if (u) {
        return await loginUtente(u);
      }
    }
  } catch (_) {}
  return false;
}

async function doLogin() {
  const u = document.getElementById('login-username').value.trim().toLowerCase();
  const p = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.classList.remove('show');

  if (!u || !p) {
    err.textContent = 'Inserisci username e password.';
    err.classList.add('show');
    return;
  }
  const utente = state.data.utenti.find(x => x.username.toLowerCase() === u && x.password === p && x.attivo);
  if (!utente) {
    err.textContent = 'Username o password non corretti.';
    err.classList.add('show');
    return;
  }
  if (!utente.vigilante_id) {
    err.textContent = 'Account non collegato a un vigilante.';
    err.classList.add('show');
    return;
  }
  await loginUtente(utente);
  await Storage.set(KEYS.session, JSON.stringify({utente_id: utente.id}));
}

async function loginUtente(utente) {
  state.utente = utente;
  state.vigilante = state.data.vigilantes.find(v => v.id === utente.vigilante_id);
  if (!state.vigilante) return false;
  document.getElementById('login-password').value = '';
  document.getElementById('home-vigilante-name').textContent =
    `${state.vigilante.cognome || ''} ${state.vigilante.nome || ''}`.trim();
  goTo('home');
  return true;
}

async function doLogout() {
  if (state.scanAbortController) {
    try { state.scanAbortController.abort(); } catch (_) {}
    state.scanAbortController = null;
  }
  state.utente = null;
  state.vigilante = null;
  await Storage.set(KEYS.session, '');
  toggleDrawer(false);
  goTo('login');
}

// ============================================================
// NAVIGATION
// ============================================================
function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === screen));
  if (screen === 'checkins') renderCheckinsList();
  if (screen === 'scan') startScan();
  // Drawer active state
  document.querySelectorAll('.drawer-menu .item').forEach(b => {
    b.classList.toggle('active', b.dataset.screen === screen);
  });
}
function goBack(target) {
  if (state.scanAbortController) { try { state.scanAbortController.abort(); } catch (_) {} state.scanAbortController = null; }
  resetScanUI();
  goTo(target);
}
function goToScan() { goTo('scan'); }
function navFromDrawer(screen) { toggleDrawer(false); goTo(screen); }

function renderCheckinsList() {
  // Filtra: solo i check-in del vigilante loggato
  const myId = state.vigilante?.id;
  const my = state.data.checkins
    .filter(c => c.vigilante_id === myId)
    .sort((a, b) => new Date(b.ora_scansione) - new Date(a.ora_scansione));
  const wrap = document.getElementById('checkins-list');
  if (!my.length) {
    wrap.innerHTML = `<div class="checkin-empty">Nessun check-in registrato.<br>Tocca il pulsante <strong>casa</strong> in basso per iniziare.</div>`;
    return;
  }
  wrap.innerHTML = my.map(ci => {
    const t = state.data.tagNfc.find(t => t.id === ci.tag_id);
    const s = t ? state.data.strutture.find(s => s.id === t.struttura_id) : null;
    const c = s ? state.data.clienti.find(c => c.id === s.cliente_id) : null;
    const tipo = s ? state.data.tipiStrutture.find(tp => tp.id === s.tipo_struttura_id) : null;
    const struttura = [tipo?.nome, s?.nome, s?.indirizzo].filter(Boolean).join(', ');
    const pending = !ci.synced;
    return `<div class="checkin-item">
      <div class="checkin-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="checkin-info">
        <div class="cliente">${escape(c ? clienteDisplay(c) : 'Sconosciuto')}${pending ? '<span class="pending-badge">offline</span>' : ''}</div>
        <div class="struttura">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10"/></svg>
          ${escape(struttura)}
        </div>
        <div class="time">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
          ${formatDateTime(ci.ora_scansione)}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ============================================================
// SCAN FLOW
// ============================================================
function resetScanUI() {
  const scan = document.getElementById('scan');
  scan.classList.remove('success', 'error');
  document.getElementById('scan-title').textContent = 'Avvicina al tag';
  document.getElementById('scan-msg').textContent = 'Tieni il telefono vicino al tag NFC della struttura per registrare il check-in.';
}

async function startScan() {
  resetScanUI();
  if (!('NDEFReader' in window)) {
    document.getElementById('scan-title').textContent = 'NFC non disponibile';
    document.getElementById('scan-msg').textContent = "Su questo dispositivo non puoi scansionare. Usa Chrome su Android, oppure tocca 'Simula scansione' per testare.";
    return;
  }
  try {
    state.scanAbortController = new AbortController();
    const reader = new NDEFReader();
    await reader.scan({signal: state.scanAbortController.signal});
    reader.onreadingerror = () => {
      document.getElementById('scan-msg').textContent = 'Errore di lettura. Riprova ad avvicinare il tag.';
    };
    reader.onreading = ({serialNumber}) => {
      handleTag(normalizeCode(serialNumber));
    };
  } catch (e) {
    if (e.name === 'AbortError') return;
    document.getElementById('scan-title').textContent = 'NFC bloccato';
    document.getElementById('scan-msg').textContent = (e.message || 'Permesso NFC negato.') + ' Tocca "Simula scansione" per testare.';
  }
}

function normalizeCode(code) {
  return String(code || '').replace(/[:\s-]/g, '').toUpperCase();
}

async function handleTag(code) {
  // Stop further scans (one tag = one check-in)
  if (state.scanAbortController) { try { state.scanAbortController.abort(); } catch (_) {} state.scanAbortController = null; }

  const tag = state.data.tagNfc.find(t => normalizeCode(t.codice_nfc) === code);
  const scan = document.getElementById('scan');

  if (!tag) {
    scan.classList.add('error');
    document.getElementById('scan-title').textContent = 'Tag non riconosciuto';
    document.getElementById('scan-msg').textContent = `Codice ${code} non trovato. Contatta l'ufficio per registrarlo.`;
    showResultModal({error: true, code});
    return;
  }

  // Get GPS (best-effort, non bloccare se non disponibile)
  let lat = null, lng = null;
  try {
    const pos = await new Promise((resolve, reject) => {
      if (!('geolocation' in navigator)) return reject('no-geo');
      navigator.geolocation.getCurrentPosition(resolve, reject, {timeout: 4000, enableHighAccuracy: true});
    });
    lat = pos.coords.latitude; lng = pos.coords.longitude;
  } catch (_) {}

  // Crea check-in
  const ci = {
    id: uid(),
    client_uuid: uid(),
    tag_id: tag.id,
    vigilante_id: state.vigilante.id,
    ora_scansione: nowISO(),
    latitudine: lat,
    longitudine: lng,
    manuale: false,
    synced: state.online, // simulazione: se online "syncato", se offline pending
  };
  state.data.checkins.unshift(ci);
  await saveSection('checkins');

  // UI success
  scan.classList.add('success');
  document.getElementById('scan-title').textContent = 'Check-in registrato';
  document.getElementById('scan-msg').textContent = '';
  showResultModal({tag, ci});

  // Vibrazione tattile (Android)
  if ('vibrate' in navigator) try { navigator.vibrate(80); } catch (_) {}
}

function openSimulator() {
  const tags = state.data.tagNfc;
  const card = document.getElementById('modal-card');
  card.className = 'modal-card';
  card.innerHTML = `
    <div class="title">Scegli tag da simulare</div>
    <div class="msg">Solo per demo: imita la scansione fisica di un tag NFC.</div>
    <div class="sim-list">
      ${tags.map(t => {
        const s = state.data.strutture.find(s => s.id === t.struttura_id);
        const c = s ? state.data.clienti.find(c => c.id === s.cliente_id) : null;
        return `<button class="sim-item" onclick="simulateTag('${t.codice_nfc}')">
          <strong>${escape(t.descrizione || 'Tag')}</strong>
          <span>${escape(c ? clienteDisplay(c) : '')} — ${escape(s?.nome || '')}</span>
        </button>`;
      }).join('')}
    </div>
    <div class="actions">
      <button class="secondary" onclick="closeModal()">Chiudi</button>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

function simulateTag(code) {
  closeModal();
  handleTag(normalizeCode(code));
}

// MODAL

function showResultModal({tag, ci, error, code}) {
  const card = document.getElementById('modal-card');
  if (error) {
    card.className = 'modal-card error';
    card.innerHTML = `
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <div class="title">Tag sconosciuto</div>
      <div class="msg">Il tag <code>${escape(code)}</code> non è registrato nel sistema.</div>
      <div class="actions">
        <button class="secondary" onclick="closeModalAndScanAgain()">Riprova</button>
        <button class="primary" onclick="closeModal(); goTo('home')">Home</button>
      </div>
    `;
  } else {
    const s = state.data.strutture.find(s => s.id === tag.struttura_id);
    const c = s ? state.data.clienti.find(c => c.id === s.cliente_id) : null;
    card.className = 'modal-card';
    card.innerHTML = `
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="title">Check-in effettuato</div>
      <div class="msg">${ci.synced ? 'Sincronizzato col server.' : 'Salvato in locale, sincronizzerà appena online.'}</div>
      <div class="details">
        <div class="row"><strong>Cliente</strong><span>${escape(c ? clienteDisplay(c) : '—')}</span></div>
        <div class="row"><strong>Struttura</strong><span>${escape(s?.nome || '—')}</span></div>
        <div class="row"><strong>Tag</strong><span>${escape(tag.descrizione || tag.codice_nfc)}</span></div>
        <div class="row"><strong>Ora</strong><span>${formatDateTime(ci.ora_scansione)}</span></div>
        ${ci.latitudine ? `<div class="row"><strong>GPS</strong><span>${ci.latitudine.toFixed(5)}, ${ci.longitudine.toFixed(5)}</span></div>` : ''}
      </div>
      <div class="actions">
        <button class="secondary" onclick="closeModalAndScanAgain()">Altro check-in</button>
        <button class="primary" onclick="closeModal(); goTo('checkins')">Vedi storico</button>
      </div>
    `;
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}
function closeModalAndScanAgain() {
  closeModal();
  resetScanUI();
  startScan();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ============================================================
// CONNECTION STATUS
// ============================================================
function updateConnection() {
  state.online = navigator.onLine;
  const pill = document.getElementById('conn-pill');
  if (!pill) return;
  pill.classList.toggle('offline', !state.online);
  const span = pill.querySelector('span');
  if (span) span.textContent = state.online ? 'online' : 'offline';
}
window.addEventListener('online', () => { updateConnection(); syncPending(); });
window.addEventListener('offline', updateConnection);

async function syncPending() {
  // Simulazione sync: in produzione qui faremmo una POST al backend per ogni check-in non synced
  let changed = false;
  for (const ci of state.data.checkins) {
    if (!ci.synced) { ci.synced = true; changed = true; }
  }
  if (changed) {
    await saveSection('checkins');
    if (document.getElementById('checkins').classList.contains('active')) renderCheckinsList();
    showToast('Check-in sincronizzati');
  }
}

// ============================================================
// INIT
// ============================================================
async function init() {
  await loadAll();
  await maybeSeed();
  updateConnection();
  const restored = await tryRestoreSession();
  if (!restored) goTo('login');
}

init();
